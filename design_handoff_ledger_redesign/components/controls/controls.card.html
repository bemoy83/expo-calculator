<!-- @dsCard group="Components" viewport="700x380" name="Controls" subtitle="Button · Field · Input · Select · Segmented · Chip · Toggle" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../controls/Button.jsx','../controls/Field.jsx','../controls/Input.jsx','../controls/Select.jsx','../controls/Segmented.jsx','../controls/Chip.jsx','../controls/Toggle.jsx']);
const { Button, Field, Input, Select, Segmented, Chip, Toggle } = DS;
function App() {
  const [cc, setCc] = React.useState('60'); const [v, setV] = React.useState('parts'); const [on, setOn] = React.useState(true); const [cat, setCat] = React.useState('all');
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
      <Button variant="accent">+ New quote</Button><Button variant="primary">Save material</Button><Button variant="secondary">Edit</Button><Button variant="ghost">Reset</Button><Button variant="danger">Remove</Button><Button disabled>Disabled</Button><Button size="sm" variant="secondary">sm</Button>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,minmax(0,1fr))', gap: '14px 16px' }}>
      <Field label="Bredde" unit="m"><Input defaultValue="4" /></Field>
      <Field label="Høyde" unit="m" error="Fill in Høyde"><Input invalid placeholder="—" /></Field>
      <Field label="Senteravstand" unit="cm"><Segmented block mono size="md" options={[{value:'40',label:'40'},{value:'60',label:'60'}]} value={cc} onChange={setCc} /></Field>
      <Field label="Material" span={2}><Select options={[{value:'a',label:'K.VIRKE 48x98',meta:'37.90/m'},{value:'b',label:'K.VIRKE 36x48',meta:'14.50/m'}]} value="a" /></Field>
      <Field label="Svinn" unit="%"><Input defaultValue="10" /></Field>
    </div>
    <div style={{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
      <Segmented options={[{value:'parts',label:'Parts'},{value:'layout',label:'Layout'}]} value={v} onChange={setV} />
      {['all','treverk','plater'].map((c, i) => <Chip key={c} selected={cat===c} count={[24,8,6][i]} onClick={() => setCat(c)}>{['All','Treverk','Plater'][i]}</Chip>)}
      <div style={{ flex: 1, minWidth: 220 }}><Toggle checked={on} onChange={setOn} label="Isoler veggen" meta="Glava 70 mm" /></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
