<!-- @dsCard group="Components" viewport="700x330" name="Lists" subtitle="RailRow · LedgerTable · LedgerRow · DashedAdd" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../lists/RailRow.jsx','../lists/LedgerTable.jsx','../lists/LedgerRow.jsx','../lists/DashedAdd.jsx']);
const { RailRow, LedgerTable, LedgerRow, DashedAdd } = DS;
const m = (s, c) => <span style={{ fontFamily: 'var(--font-numeric)', fontSize: 13, color: c ? 'rgb(var(--ink-muted))' : undefined }}>{s}</span>;
function App() {
  const [sel, setSel] = React.useState(1); const [row, setRow] = React.useState(null);
  return <div style={{ display: 'grid', gridTemplateColumns: '250px minmax(0,1fr)', gap: 20 }}>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      {[['Bakvegg','30.8 m','1 167.32'],['Sidevegg 1','25.85 m','979.72'],['Isolasjon',null,null]].map((r, i) => <RailRow key={i} index={i+1} title={r[0]} subtitle={r[1]} value={r[2]} status={r[2] ? undefined : 'error'} selected={sel===i+1} onClick={() => setSel(i+1)} />)}
      <DashedAdd>+ Add from calculator</DashedAdd>
    </div>
    <LedgerTable columns={[{label:'Quote'},{label:'Lines',align:'right',width:'56px'},{label:'Total',align:'right',width:'110px'},{label:'',align:'right',width:'52px'}]}>
      {[['Stand A04 — Byggmesse','8','$12 480.00'],['Møterom 2. etg','5','$7 915.50'],['Stand C20 — Nor-Fishing','11','$21 306.25']].map((r, i) =>
        <LedgerRow key={i} selected={row===i} onClick={() => setRow(i)} cells={[<b style={{fontWeight:600}}>{r[0]}</b>, m(r[1], 1), m(r[2]), <span style={{color:'rgb(var(--ink-faint))'}}>⋯</span>]} hoverCell={<span style={{color:'rgb(var(--danger))',fontSize:13}}>Delete</span>} />)}
    </LedgerTable>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
