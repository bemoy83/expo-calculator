<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../formula/FormulaText.jsx']);
const { FormulaText } = DS;
function App() {
  const n = { stendere: 'function', bredde: 'input', cc: 'input', antall: 'result', material: 'input', stenderlengde: 'result', svill: 'result', svinn: 'input' };
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 12, fontSize: 15 }}>
    <FormulaText block expression="stendere(bredde, cc)" names={n} />
    <FormulaText block expression="(stenderlengde + svill) × (1 + svinn / 100)" names={n} />
    <FormulaText block expression="antall × material.price" names={n} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
