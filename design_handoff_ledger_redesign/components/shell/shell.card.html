<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../shell/Eyebrow.jsx','../shell/TopBar.jsx','../shell/PageHeader.jsx','../shell/CatalogTabs.jsx','../controls/Button.jsx']);
const { TopBar, PageHeader, CatalogTabs, Eyebrow, Button } = DS;
function App() {
  const [tab, setTab] = React.useState('catalog'); const [sub, setSub] = React.useState('materials');
  return <div style={{ border: '1px solid rgb(var(--border))', borderRadius: 8, overflow: 'hidden' }}>
    <TopBar tabs={[{id:'calculators',label:'Calculators'},{id:'quotes',label:'Quotes'},{id:'catalog',label:'Catalog'}]} active={tab} onSelect={setTab} right={<span>Settings</span>} />
    <PageHeader eyebrow="Catalog · prices used by every calculator" title="Catalog" actions={<Button variant="accent">+ New material</Button>}>
      <CatalogTabs items={[{id:'materials',label:'Materials',count:24},{id:'labor',label:'Labor',count:9},{id:'functions',label:'Functions',count:6}]} active={sub} onSelect={setSub} />
    </PageHeader>
    <PageHeader eyebrow="Calculators / Vegger · editing · unsaved" title="Bindingsverk" editing status={{tone:'error',label:'1 step has an error'}} actions={<><Button variant="secondary">Cancel</Button><Button variant="accent">Save</Button></>} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
