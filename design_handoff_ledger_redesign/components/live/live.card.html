<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../live/LiveLabel.jsx','../live/ResultRow.jsx','../live/CommitBlock.jsx']);
const { LiveLabel, ResultRow, CommitBlock } = DS;
function App() {
  return <div style={{ display: 'grid', gridTemplateColumns: '300px minmax(0,1fr)', gap: 20 }}>
    <div style={{ background: 'rgb(var(--panel))', border: '1px solid rgb(var(--border))', borderRadius: 8, padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
      <LiveLabel context="In the quote" />
      <ResultRow label="Bakvegg" detail="30.8 m · 4 × 2.5 m · cc 60" value="1 167.32" leader={false} />
      <ResultRow label="Stendere" value="8" unit="stk" />
      <ResultRow label="Bindingsverk antall" value="30.8" unit="m" highlight />
      <ResultRow label="Line total" value="$1 167.32" total />
      <CommitBlock label="Total incl. VAT" amount="$4 299.30" actionLabel="Export quote" />
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <CommitBlock layout="row" eyebrow="Pick up where you left off" title="Stand B12 — Norway Expo" meta="3 lines · edited 23 min ago" amount="$4 299.30" actionLabel="Continue" />
      <CommitBlock layout="compact" label="Total excl. VAT" amount="$1 812.32" actionLabel="Send to quote" note="→ Stand B12 — Norway Expo" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
