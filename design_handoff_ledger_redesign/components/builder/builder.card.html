<!-- @dsCard group="Components" viewport="700x300" name="Builder" subtitle="StepRow · FormulaWell" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../_load.js"></script>
<style>body{padding:18px;font-size:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const DS = await loadDS(['../formula/FormulaText.jsx','../builder/FormulaWell.jsx','../builder/StepRow.jsx','../controls/Chip.jsx']);
const { StepRow, FormulaWell, FormulaText } = DS;
const names = { bredde: 'input', hoyde: 'input', svinn: 'input', material: 'input', stendere: 'result', stenderlengde: 'result', svill: 'result', antall: 'result' };
const opt = (t, on) => <span style={{ padding: '6px 10px', borderRadius: 7, fontSize: 13, background: on ? 'var(--accent-soft)' : 'rgb(var(--sunken))', color: on ? 'rgb(var(--ink))' : 'rgb(var(--ink-muted))' }}>{t}</span>;
function App() {
  const [open, setOpen] = React.useState(3);
  const steps = [['Stenderlengde','stendere × hoyde','20','m'],['Svill + topp','bredde × 2','8','m'],['Bindingsverk antall','(stenderlengde + svill) × (1 + svinn / 100)','30.8','m'],['Kost','antall × material.price','1 167.32',null,true]];
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
    {steps.map((s, i) => <StepRow key={i} index={i+2} label={s[0]} formula={<FormulaText expression={s[1]} names={names} />} value={s[2]} unit={s[3]} cost={s[4]} expanded={open===i} note="Shown to staff" onToggle={() => setOpen(open===i ? -1 : i)}>
      <FormulaWell focused><FormulaText expression={s[1]} names={names} /></FormulaWell>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{opt('Formula ▾')}{opt('Number · m ▾')}{opt('✓ Show to staff', true)}{opt("Part's cost")}</div>
    </StepRow>)}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
