<!-- @dsCard group="Colors" viewport="700x150" subtitle="Accent fills; ink inverse for the one commit block" name="Accent & inverse" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-size:14px}.m{font-family:var(--font-numeric)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw b{display:block;height:56px;border-radius:8px;border:1px solid rgb(var(--border))}.sw span{display:block;font-size:12px;margin-top:6px}.sw i{font-style:normal;font-family:var(--font-numeric);font-size:11px;color:rgb(var(--ink-faint))}</style></head><body><div class="row"><div class="sw"><b style="background:rgb(var(--accent))"></b><span>--accent</span><i>#ec6f00 signal</i></div><div class="sw"><b style="background:rgb(var(--accent-ink))"></b><span>--accent-ink</span><i>#140c05</i></div><div class="sw"><b style="background:var(--accent-soft)"></b><span>--accent-soft</span><i>15% accent</i></div><div class="sw"><b style="background:rgb(var(--inverse))"></b><span>--inverse</span><i>= ink</i></div><div class="sw"><b style="background:rgb(var(--on-inverse))"></b><span>--on-inverse</span><i>= canvas</i></div></div></body></html>
