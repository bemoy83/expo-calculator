<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-size:14px}.m{font-family:var(--font-numeric)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw b{display:block;height:56px;border-radius:8px;border:1px solid rgb(var(--border))}.sw span{display:block;font-size:12px;margin-top:6px}.sw i{font-style:normal;font-family:var(--font-numeric);font-size:11px;color:rgb(var(--ink-faint))}</style></head><body><div class="row"><div class="sw"><b style="background:rgb(var(--canvas))"></b><span>--canvas</span><i>#f2f0eb</i></div><div class="sw"><b style="background:rgb(var(--panel))"></b><span>--panel</span><i>#faf9f6</i></div><div class="sw"><b style="background:rgb(var(--surface))"></b><span>--surface</span><i>#ffffff</i></div><div class="sw"><b style="background:rgb(var(--sunken))"></b><span>--sunken</span><i>#e7e4dd</i></div><div class="sw"><b style="background:rgb(var(--border))"></b><span>--border</span><i>#dcd8cf</i></div><div class="sw"><b style="background:rgb(var(--border-strong))"></b><span>--border-strong</span><i>#c4bfb4</i></div></div></body></html>
