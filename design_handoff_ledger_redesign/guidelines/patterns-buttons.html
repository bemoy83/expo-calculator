<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-size:14px}.m{font-family:var(--font-numeric)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:118px}.sw b{display:block;height:56px;border-radius:8px;border:1px solid rgb(var(--border))}.sw span{display:block;font-size:12px;margin-top:6px}.sw i{font-style:normal;font-family:var(--font-numeric);font-size:11px;color:rgb(var(--ink-faint))}</style></head><body><div class="row" style="font-size:13px;font-weight:600;align-items:center"><span style="padding:9px 14px;border-radius:8px;background:rgb(var(--accent));color:rgb(var(--accent-ink))">+ New quote</span><span style="padding:9px 14px;border-radius:8px;background:rgb(var(--ink));color:rgb(var(--canvas))">Save material</span><span style="padding:9px 14px;border-radius:8px;border:1px solid rgb(var(--border-strong))">Edit</span><span style="padding:9px 14px;color:rgb(var(--ink-muted))">Reset</span><span style="padding:9px 14px;color:rgb(var(--danger))">Remove</span><span style="padding:9px 14px;border-radius:8px;background:rgb(var(--sunken));color:rgb(var(--ink-faint))">Disabled</span></div></body></html>
